<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ATSWA Part II — Study</title>
<meta name="description" content="The four ATSWA Part II subjects as chapter-by-chapter study notes with worked examples, typeset formulas, per-chapter quizzes, and 24 diets of past papers with expanded solutions.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#12110F" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231F6244'/%3E%3Cpath d='M7 6h18v6H13v5h11v6H13v6H7z' fill='%23FCFBF7'/%3E%3C/svg%3E">
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ══ tokens ══════════════════════════════════════════════════════════ */
:root{
  --ground:#F2F1EC; --paper:#FCFBF7; --sunk:#E8E6DE; --raise:#FFFFFE;
  --veil:rgba(24,22,18,.42);
  --ink:#191713; --ink2:#514C43; --ink3:#837C70; --ink4:#A9A296;
  --rule:#DAD6CB; --rule2:#E9E6DC;
  --fa:#1F6244; --ps:#2A4A86; --qa:#8A4418; --it:#1C5C68;
  --ok:#2A6B47; --no:#A33125; --flag:#7A5A0E; --look:#5B4C86;
  --ok-bg:#2A6B4714; --no-bg:#A3312514; --flag-bg:#7A5A0E14; --look-bg:#5B4C8614;
  --ok-edge:#2A6B4747; --no-edge:#A3312547;
  --accent:var(--fa); --accent-bg:#1F624414; --accent-edge:#1F62443D;
  --on-accent:#FCFBF7;
  --shadow:0 1px 2px rgba(24,22,18,.05), 0 14px 34px -22px rgba(24,22,18,.30);
  --lift:0 -1px 0 var(--rule), 0 -12px 28px -22px rgba(24,22,18,.42);
  --sans:"Archivo",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#12110F; --paper:#1A1917; --sunk:#0D0C0B; --raise:#222120;
  --veil:rgba(0,0,0,.66);
  --ink:#EDEAE3; --ink2:#ADA79B; --ink3:#847E73; --ink4:#5F5A51;
  --rule:#302E2A; --rule2:#242220;
  --fa:#69C79B; --ps:#8FB1F0; --qa:#E0A063; --it:#6DC2D2;
  --ok:#68C595; --no:#E8877A; --flag:#D9B45F; --look:#A99BE0;
  --ok-bg:#68C5951F; --no-bg:#E8877A1F; --flag-bg:#D9B45F1F; --look-bg:#A99BE01F;
  --ok-edge:#68C59547; --no-edge:#E8877A47;
  --accent:var(--fa); --accent-bg:#69C79B1F; --accent-edge:#69C79B47;
  --on-accent:#12110F;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 34px -22px rgba(0,0,0,.8);
  --lift:0 -1px 0 var(--rule), 0 -12px 28px -22px rgba(0,0,0,.85);
}}
:root[data-theme="dark"]{
  --ground:#12110F; --paper:#1A1917; --sunk:#0D0C0B; --raise:#222120;
  --veil:rgba(0,0,0,.66);
  --ink:#EDEAE3; --ink2:#ADA79B; --ink3:#847E73; --ink4:#5F5A51;
  --rule:#302E2A; --rule2:#242220;
  --fa:#69C79B; --ps:#8FB1F0; --qa:#E0A063; --it:#6DC2D2;
  --ok:#68C595; --no:#E8877A; --flag:#D9B45F; --look:#A99BE0;
  --ok-bg:#68C5951F; --no-bg:#E8877A1F; --flag-bg:#D9B45F1F; --look-bg:#A99BE01F;
  --ok-edge:#68C59547; --no-edge:#68C59547;
  --accent:var(--fa); --accent-bg:#69C79B1F; --accent-edge:#69C79B47;
  --on-accent:#12110F;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 14px 34px -22px rgba(0,0,0,.8);
  --lift:0 -1px 0 var(--rule), 0 -12px 28px -22px rgba(0,0,0,.85);
}
[data-sub="FA"]{--accent:var(--fa);--accent-bg:#1F624414;--accent-edge:#1F62443D;}
[data-sub="PS"]{--accent:var(--ps);--accent-bg:#2A4A8614;--accent-edge:#2A4A863D;}
[data-sub="QA"]{--accent:var(--qa);--accent-bg:#8A441814;--accent-edge:#8A44183D;}
[data-sub="IT"]{--accent:var(--it);--accent-bg:#1C5C6814;--accent-edge:#1C5C683D;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) [data-sub="FA"]{--accent-bg:#69C79B1F;--accent-edge:#69C79B47;}
:root:not([data-theme="light"]) [data-sub="PS"]{--accent-bg:#8FB1F01F;--accent-edge:#8FB1F047;}
:root:not([data-theme="light"]) [data-sub="QA"]{--accent-bg:#E0A0631F;--accent-edge:#E0A06347;}
:root:not([data-theme="light"]) [data-sub="IT"]{--accent-bg:#6DC2D21F;--accent-edge:#6DC2D247;}}
:root[data-theme="dark"] [data-sub="FA"]{--accent-bg:#69C79B1F;--accent-edge:#69C79B47;}
:root[data-theme="dark"] [data-sub="PS"]{--accent-bg:#8FB1F01F;--accent-edge:#8FB1F047;}
:root[data-theme="dark"] [data-sub="QA"]{--accent-bg:#E0A0631F;--accent-edge:#E0A06347;}
:root[data-theme="dark"] [data-sub="IT"]{--accent-bg:#6DC2D21F;--accent-edge:#6DC2D247;}

/* ══ base ════════════════════════════════════════════════════════════ */
*{box-sizing:border-box;}
html{scrollbar-gutter:stable;-webkit-text-size-adjust:100%;}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:var(--serif);font-size:18px;line-height:1.62;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;}
h1,h2,h3,h4{margin:0;font-family:var(--sans);font-weight:600;
  letter-spacing:-.015em;text-wrap:balance;line-height:1.2;}
p{margin:0 0 .85em;text-wrap:pretty;}
p:last-child{margin-bottom:0;}
a{color:var(--accent);text-decoration:none;}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;
  font-family:var(--sans);}
input,select{font:inherit;color:inherit;font-family:var(--sans);}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px;}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px;}
.col{max-width:760px;margin:0 auto;}
.hide{display:none !important;}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums;}
.eyebrow{font-family:var(--mono);font-size:10.5px;font-weight:500;letter-spacing:.16em;
  text-transform:uppercase;color:var(--ink3);}
.num{font-variant-numeric:tabular-nums;}

/* ══ masthead ════════════════════════════════════════════════════════ */
header.top{border-bottom:1px solid var(--rule);background:var(--paper);
  position:sticky;top:0;z-index:40;}
.top-in{display:flex;align-items:center;gap:12px;height:58px;}
.mark{display:flex;align-items:center;gap:10px;font-family:var(--sans);
  font-weight:700;font-size:16px;letter-spacing:-.02em;padding:0;flex:none;}
.mark .sig{width:22px;height:22px;flex:none;}
.mark .sig i{display:block;width:100%;height:100%;background:var(--ink);
  clip-path:polygon(0 0,100% 0,100% 34%,34% 34%,34% 62%,86% 62%,86% 92%,0 92%);}
.mark b{font-weight:700;}
.mark span{color:var(--ink3);font-weight:500;}
nav.tabs{display:flex;gap:2px;margin-left:14px;overflow-x:auto;
  scrollbar-width:none;flex:1;}
nav.tabs::-webkit-scrollbar{display:none;}
nav.tabs a{font-family:var(--sans);font-size:13px;font-weight:500;color:var(--ink2);
  padding:7px 11px;border-radius:4px;white-space:nowrap;letter-spacing:-.005em;}
nav.tabs a:hover{background:var(--sunk);color:var(--ink);}
nav.tabs a[aria-current]{background:var(--accent-bg);color:var(--accent);}
.top-act{display:flex;gap:6px;flex:none;}
.icob{width:32px;height:32px;display:grid;place-items:center;border-radius:4px;
  color:var(--ink3);}
.icob:hover{background:var(--sunk);color:var(--ink);}
.icob svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round;}

/* ══ home ════════════════════════════════════════════════════════════ */
.hero{padding:60px 0 34px;}
.hero h1{font-size:clamp(36px,6vw,62px);line-height:1.02;letter-spacing:-.035em;
  max-width:15ch;font-weight:700;}
.hero .lede{font-size:20px;color:var(--ink2);max-width:56ch;margin-top:20px;}
.tally{display:flex;gap:30px;flex-wrap:wrap;margin-top:28px;padding-top:22px;
  border-top:1px solid var(--rule);}
.tally div{font-family:var(--mono);font-size:11.5px;color:var(--ink3);
  letter-spacing:.04em;text-transform:uppercase;}
.tally b{display:block;font-family:var(--sans);font-size:27px;color:var(--ink);
  font-weight:700;letter-spacing:-.02em;text-transform:none;
  font-variant-numeric:tabular-nums;line-height:1.15;}

.subs{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--rule);
  border:1px solid var(--rule);margin:36px 0 0;}
@media (max-width:760px){.subs{grid-template-columns:1fr;}}
.subcard{background:var(--paper);padding:24px 24px 20px;text-align:left;display:block;
  width:100%;transition:background .15s;position:relative;}
.subcard:hover{background:var(--raise);}
.subcard .r1{display:flex;align-items:center;gap:9px;margin-bottom:12px;}
.subcard .code{font-family:var(--mono);font-size:11px;font-weight:600;
  letter-spacing:.13em;color:var(--accent);}
.subcard .cnt{margin-left:auto;font-family:var(--mono);font-size:10px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--ink3);
  border:1px solid var(--rule);padding:3px 7px;border-radius:3px;}
.subcard h2{font-size:24px;letter-spacing:-.025em;}
.subcard .sub{color:var(--ink2);font-size:16px;margin-top:7px;line-height:1.5;}
.subcard .bar{height:3px;background:var(--rule2);margin-top:16px;overflow:hidden;}
.subcard .bar i{display:block;height:100%;background:var(--accent);transition:width .3s;}
.subcard .foot{margin-top:9px;display:flex;gap:12px;font-family:var(--mono);
  font-size:10.5px;color:var(--ink3);letter-spacing:.05em;}
.subcard .foot b{color:var(--ink2);font-weight:600;}

.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:1px;background:var(--rule);border:1px solid var(--rule);margin:36px 0 70px;}
.panel{background:var(--paper);padding:22px 22px 20px;}
.panel h3{font-family:var(--mono);font-size:10.5px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink3);font-weight:500;margin-bottom:9px;}
.panel p{font-size:15.5px;color:var(--ink2);line-height:1.55;}
.panel b{color:var(--ink);font-weight:600;}

.ghead{margin:0;}
.ghead h2{font-size:clamp(24px,3.4vw,32px);letter-spacing:-.025em;}
.ghead p{color:var(--ink2);max-width:62ch;margin-top:8px;font-size:16px;}

/* ══ subject page ════════════════════════════════════════════════════ */
.shead{padding:44px 0 26px;border-bottom:1px solid var(--rule);}
.shead .code{font-family:var(--mono);font-size:11px;font-weight:600;
  letter-spacing:.14em;color:var(--accent);}
.shead h1{font-size:clamp(30px,4.6vw,46px);letter-spacing:-.032em;margin-top:10px;}
.shead p{color:var(--ink2);max-width:62ch;margin-top:14px;font-size:17.5px;}
.sbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center;}
.btn{font-family:var(--sans);font-size:13.5px;font-weight:500;padding:8px 15px;
  border:1px solid var(--rule);border-radius:4px;color:var(--ink);background:var(--paper);
  transition:.14s;display:inline-flex;align-items:center;gap:7px;}
.btn:hover{border-color:var(--ink3);background:var(--raise);}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent);}
.btn.pri:hover{filter:brightness(1.08);}
.btn.sm{font-size:12.5px;padding:6px 11px;}

.chlist{margin:0 0 70px;border:1px solid var(--rule);border-bottom:none;}
.chrow{display:flex;align-items:baseline;gap:15px;width:100%;text-align:left;
  padding:15px 20px;border-bottom:1px solid var(--rule);background:var(--paper);
  transition:background .13s;}
.chrow:hover{background:var(--sunk);}
.chrow .n{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--accent);
  width:2.3em;flex:none;font-variant-numeric:tabular-nums;}
.chrow .body{flex:1;min-width:0;}
.chrow .t{font-family:var(--sans);font-size:17px;font-weight:600;letter-spacing:-.015em;
  line-height:1.3;}
.chrow .d{font-size:15px;color:var(--ink3);margin-top:3px;line-height:1.45;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.chrow .meta{flex:none;display:flex;align-items:center;gap:9px;align-self:center;
  font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink3);}
.pill{border:1px solid var(--rule);border-radius:3px;padding:3px 6px;white-space:nowrap;}
.pill.on{border-color:var(--ok-edge);color:var(--ok);background:var(--ok-bg);}
.dot{width:7px;height:7px;border-radius:50%;background:var(--rule);flex:none;}
.dot.on{background:var(--ok);}
.dot.half{background:linear-gradient(90deg,var(--ok) 50%,var(--rule) 50%);}

/* ══ reader ══════════════════════════════════════════════════════════ */
.rlayout{display:grid;grid-template-columns:minmax(0,1fr) 236px;gap:44px;
  align-items:start;padding:34px 0 80px;}
@media (max-width:980px){.rlayout{grid-template-columns:1fr;gap:0;}
  .rtoc{display:none;}}
.rtoc{position:sticky;top:78px;font-family:var(--sans);font-size:13.5px;
  max-height:calc(100vh - 100px);overflow-y:auto;padding-bottom:20px;}
.rtoc h4{font-family:var(--mono);font-size:10px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink3);font-weight:500;margin-bottom:11px;}
.rtoc a{display:block;padding:5px 0 5px 11px;color:var(--ink2);
  border-left:2px solid var(--rule2);line-height:1.35;}
.rtoc a:hover{color:var(--ink);border-color:var(--ink4);}
.rtoc a.here{color:var(--accent);border-color:var(--accent);font-weight:600;}

.chead{padding-bottom:26px;margin-bottom:28px;border-bottom:2px solid var(--ink);}
.chead .kicker{font-family:var(--mono);font-size:11px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--accent);font-weight:500;}
.chead h1{font-size:clamp(28px,4.4vw,42px);letter-spacing:-.032em;margin-top:9px;}
.chead .brief{font-size:19px;color:var(--ink2);margin-top:15px;max-width:60ch;}

.lo{background:var(--paper);border:1px solid var(--rule);border-left:3px solid var(--accent);
  padding:18px 22px;margin:0 0 30px;}
.lo h4{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--ink3);font-weight:500;margin-bottom:10px;}
.lo ul{margin:0;padding-left:19px;font-size:16.5px;color:var(--ink2);}
.lo li{margin:5px 0;}

.sec{margin:0 0 40px;scroll-margin-top:78px;transition:background-color 1.8s ease;
  border-radius:8px;}
.sec.landed{background-color:var(--accent-wash,rgba(31,98,68,.08));}
.sec > h2{font-size:25px;letter-spacing:-.026em;padding-bottom:9px;
  border-bottom:1px solid var(--rule);margin-bottom:18px;
  display:flex;align-items:baseline;gap:11px;}
.sec > h2 .sn{font-family:var(--mono);font-size:13px;color:var(--accent);font-weight:600;
  flex:none;}
.sec h3{font-size:19px;margin:26px 0 10px;letter-spacing:-.02em;}
.sec h4{font-size:16.5px;margin:20px 0 8px;color:var(--ink2);font-family:var(--sans);}
.sec ul,.sec ol{margin:0 0 .9em;padding-left:22px;}
.sec li{margin:6px 0;}
.sec li::marker{color:var(--ink4);}
.sec ol li::marker{font-family:var(--mono);font-size:.85em;color:var(--accent);}

/* blocks */
.dfn{border-left:3px solid var(--accent-edge);background:var(--accent-bg);
  padding:13px 17px;margin:0 0 1em;border-radius:0 3px 3px 0;}
.dfn b{font-family:var(--sans);font-weight:600;}
.callout{border:1px solid var(--rule);background:var(--paper);padding:14px 17px;
  margin:0 0 1em;border-radius:3px;font-size:16.5px;display:flex;gap:12px;}
.callout .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;flex:none;padding-top:5px;font-weight:600;}
.callout.note{border-left:3px solid var(--ink4);}
.callout.note .lbl{color:var(--ink3);}
.callout.key{border-left:3px solid var(--ok);background:var(--ok-bg);border-color:var(--ok-edge);}
.callout.key .lbl{color:var(--ok);}
.callout.warn{border-left:3px solid var(--flag);background:var(--flag-bg);}
.callout.warn .lbl{color:var(--flag);}
.callout .cbody{flex:1;min-width:0;}

.eq{margin:1.1em 0;overflow-x:auto;overflow-y:hidden;padding:4px 0;text-align:center;}
.eq math{font-size:1.14em;}
.eqn{display:flex;align-items:center;gap:14px;margin:1.1em 0;}
.eqn .eq{flex:1;margin:0;}
.eqn .tag{font-family:var(--mono);font-size:12px;color:var(--ink3);flex:none;}
math{font-family:var(--serif);}
.mtxt{font-family:var(--serif);}

.tbl{margin:0 0 1.2em;overflow-x:auto;border:1px solid var(--rule);background:var(--paper);}
.tbl table{border-collapse:collapse;width:100%;font-size:15.5px;font-family:var(--sans);}
.tbl caption{caption-side:top;text-align:left;padding:11px 14px 9px;
  font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--ink3);border-bottom:1px solid var(--rule);}
.tbl th{text-align:left;font-weight:600;padding:9px 14px;background:var(--sunk);
  border-bottom:1px solid var(--rule);font-size:13.5px;letter-spacing:.01em;
  white-space:nowrap;}
.tbl td{padding:8px 14px;border-bottom:1px solid var(--rule2);vertical-align:top;}
.tbl tr:last-child td{border-bottom:none;}
.tbl td.r,.tbl th.r{text-align:right;font-family:var(--mono);
  font-variant-numeric:tabular-nums;white-space:nowrap;}
.tbl tr.tot td{border-top:1px solid var(--ink3);font-weight:600;
  border-bottom:2.5px double var(--ink3);}
.tbl tr.sub td{background:var(--sunk);font-weight:600;}
.tbl .tnote{padding:9px 14px;font-size:14px;color:var(--ink3);border-top:1px solid var(--rule);
  font-family:var(--serif);}

.eg{border:1px solid var(--rule);background:var(--paper);margin:0 0 1.3em;border-radius:3px;
  box-shadow:var(--shadow);}
.eg > .h{display:flex;align-items:baseline;gap:10px;padding:13px 18px;
  border-bottom:1px solid var(--rule);background:var(--sunk);}
.eg > .h .tag{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent);font-weight:600;}
.eg > .h .t{font-family:var(--sans);font-weight:600;font-size:15.5px;
  letter-spacing:-.01em;}
.eg .qz{padding:16px 18px;font-size:16.5px;}
.eg .az{padding:16px 18px;border-top:1px solid var(--rule);background:var(--raise);}
.eg .az::before{content:"Solution";display:block;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);margin-bottom:10px;}
.eg .az.hid{display:none;}
.eg .reveal{width:100%;padding:11px;border-top:1px solid var(--rule);
  font-family:var(--mono);font-size:11px;letter-spacing:.11em;text-transform:uppercase;
  color:var(--accent);background:var(--raise);}
.eg .reveal:hover{background:var(--accent-bg);}

.tacc{margin:0 0 1.2em;border:1px solid var(--rule);background:var(--paper);}
.tacc .h{padding:9px 14px;font-family:var(--sans);font-weight:600;font-size:14.5px;
  text-align:center;border-bottom:1px solid var(--ink3);background:var(--sunk);}
.tacc .g{display:grid;grid-template-columns:1fr 1fr;}
.tacc .side{padding:0;}
.tacc .side:first-child{border-right:1px solid var(--ink3);}
.tacc .sh{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink3);padding:6px 12px;
  border-bottom:1px solid var(--rule2);}
.tacc .ln{display:flex;gap:10px;padding:5px 12px;font-size:14.5px;font-family:var(--sans);}
.tacc .ln span{flex:1;min-width:0;}
.tacc .ln b{font-family:var(--mono);font-weight:500;font-variant-numeric:tabular-nums;
  white-space:nowrap;}
.tacc .ln.tot{border-top:1px solid var(--ink3);border-bottom:2.5px double var(--ink3);
  font-weight:600;margin-top:4px;}

.stmt{margin:0 0 1.3em;border:1px solid var(--rule);background:var(--paper);
  overflow-x:auto;}
.stmt .h{padding:12px 16px 10px;border-bottom:1px solid var(--rule);background:var(--sunk);}
.stmt .h .t{font-family:var(--sans);font-weight:600;font-size:15.5px;letter-spacing:-.01em;}
.stmt .h .s{font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-top:3px;
  letter-spacing:.06em;}
.stmt table{border-collapse:collapse;width:100%;font-size:15px;font-family:var(--sans);}
.stmt td{padding:4px 16px;}
.stmt td.v{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;
  white-space:nowrap;width:1%;}
.stmt tr.hd td{font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink3);padding-top:12px;}
.stmt tr.b td{font-weight:600;}
.stmt tr.t td{border-top:1px solid var(--ink3);font-weight:600;}
.stmt tr.tt td{border-top:1px solid var(--ink3);border-bottom:2.5px double var(--ink3);
  font-weight:600;}
.stmt tr.gap td{height:9px;padding:0;}
.stmt tr.ind td:first-child{padding-left:32px;}

.pre{font-family:var(--mono);font-size:13px;line-height:1.5;white-space:pre;
  overflow-x:auto;background:var(--paper);border:1px solid var(--rule);
  padding:13px 15px;margin:0 0 1.1em;border-radius:3px;
  font-variant-numeric:tabular-nums;}
.steps{counter-reset:st;margin:0 0 1.1em;padding:0;list-style:none;}
.steps li{counter-increment:st;position:relative;padding-left:36px;margin:9px 0;}
.steps li::before{content:counter(st);position:absolute;left:0;top:2px;
  width:24px;height:24px;border-radius:50%;background:var(--accent-bg);
  border:1px solid var(--accent-edge);color:var(--accent);
  font-family:var(--mono);font-size:11px;font-weight:600;display:grid;place-items:center;}

.fbox{border:1px solid var(--accent-edge);background:var(--accent-bg);margin:0 0 1.4em;
  border-radius:3px;}
.fbox h4{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--accent);font-weight:600;padding:12px 16px 0;}
.fbox .row{padding:11px 16px;border-bottom:1px solid var(--accent-edge);}
.fbox .row:last-child{border-bottom:none;}
.fbox .row .lb{font-family:var(--sans);font-size:13.5px;font-weight:600;color:var(--ink2);
  margin-bottom:4px;}
.fbox .row .nt{font-size:14.5px;color:var(--ink2);margin-top:5px;}
.fbox .eq{margin:.3em 0;text-align:left;}

/* chapter foot */
.cfoot{margin-top:46px;padding-top:26px;border-top:2px solid var(--ink);
  display:flex;gap:12px;flex-wrap:wrap;align-items:center;}
.cnav{display:flex;justify-content:space-between;gap:12px;margin-top:34px;}
.cnav a{flex:1;border:1px solid var(--rule);background:var(--paper);padding:13px 16px;
  border-radius:3px;color:var(--ink);transition:.14s;min-width:0;}
.cnav a:hover{border-color:var(--accent);background:var(--raise);}
.cnav a .l{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink3);display:block;margin-bottom:4px;}
.cnav a .t{font-family:var(--sans);font-weight:600;font-size:15px;letter-spacing:-.015em;
  display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cnav a.nx{text-align:right;}

/* ══ quiz ════════════════════════════════════════════════════════════ */
.qwrap{min-height:100vh;display:flex;flex-direction:column;}
.qbar{position:sticky;top:0;z-index:35;background:var(--paper);
  border-bottom:1px solid var(--rule);}
.qbar-in{display:flex;align-items:center;gap:13px;height:54px;max-width:860px;
  margin:0 auto;padding:0 20px;}
.qbar .x{font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink3);flex:none;}
.qbar .x:hover{color:var(--ink);}
.qbar .nm{font-family:var(--sans);font-weight:600;font-size:14px;letter-spacing:-.012em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;}
.qbar .sc{margin-left:auto;flex:none;display:flex;align-items:center;gap:11px;
  font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink2);}
.qbar .sc .r{color:var(--ok);} .qbar .sc .w{color:var(--no);}
.qbar .sc em{font-style:normal;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  opacity:.7;}
.qbar .clock{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--ink);
  font-variant-numeric:tabular-nums;}
.qbar .clock.low{color:var(--no);}
.qprog{height:2px;background:var(--rule2);}
.qprog i{display:block;height:100%;background:var(--accent);transition:width .25s;}

.qbody{flex:1;padding:28px 20px 24px;}
.qcol{max-width:790px;margin:0 auto;}
.qcard{background:var(--paper);border:1px solid var(--rule);box-shadow:var(--shadow);
  border-radius:3px;}
.qhead{display:flex;align-items:baseline;gap:12px;padding:18px 24px 0;flex-wrap:wrap;}
.qhead .n{font-family:var(--sans);font-size:25px;font-weight:700;color:var(--accent);
  line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
.qhead .tp{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);background:var(--accent-bg);border:1px solid var(--accent-edge);
  padding:3px 7px;border-radius:3px;}
.qhead .sr{margin-left:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink3);text-align:right;}
.qhead .sr a{color:var(--ink2);border-bottom:1px solid var(--rule);}
.qhead .sr a:hover{color:var(--accent);border-color:var(--accent-edge);}
.qsrc{padding:8px 24px 0;font-family:var(--mono);font-size:11px;letter-spacing:.04em;
  color:var(--ink3);}
.qsrc a.cite{color:var(--accent);}
.qstem{padding:12px 24px 18px;font-size:18.5px;line-height:1.52;}
.qstem .pre{margin-top:12px;font-size:12.5px;}
.qpre{margin:0 24px 14px;padding:12px 15px;background:var(--sunk);border-radius:3px;
  font-size:15.5px;}
.qpre .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink3);margin-bottom:7px;}
.qpre .pre{background:transparent;border:none;padding:0;margin:0;}

.opts{display:flex;flex-direction:column;border-top:1px solid var(--rule2);}
.opt{display:flex;gap:13px;align-items:flex-start;text-align:left;width:100%;
  padding:13px 24px;border-bottom:1px solid var(--rule2);line-height:1.48;
  font-size:16.5px;transition:background .12s;font-family:var(--serif);}
.opt:last-child{border-bottom:none;}
.opt:not([disabled]):hover{background:var(--sunk);}
.opt .bub{flex:none;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--rule);
  display:grid;place-items:center;font-family:var(--mono);font-size:10.5px;font-weight:600;
  color:var(--ink3);margin-top:2px;transition:.13s;}
.opt:not([disabled]):hover .bub{border-color:var(--ink3);color:var(--ink2);}
.opt .tx{flex:1;min-width:0;}
.opt .tx .pre{margin:0;background:transparent;border:none;padding:0;font-size:12.5px;}
.opt[data-s="pick"]{background:var(--sunk);}
.opt[data-s="pick"] .bub{background:var(--ink);border-color:var(--ink);color:var(--ground);}
.opt[data-s="ok"]{background:var(--ok-bg);}
.opt[data-s="ok"] .bub{background:var(--ok);border-color:var(--ok);color:var(--on-accent);}
.opt[data-s="no"]{background:var(--no-bg);}
.opt[data-s="no"] .bub{background:var(--no);border-color:var(--no);color:var(--on-accent);}
.opt[data-s="ok"] .tx,.opt[data-s="no"] .tx{font-weight:500;}
.opt .mk{margin-left:auto;align-self:center;flex:none;font-family:var(--mono);font-size:9px;
  letter-spacing:.13em;text-transform:uppercase;}
.opt[data-s="ok"] .mk{color:var(--ok);} .opt[data-s="no"] .mk{color:var(--no);}

.why{border-top:1px solid var(--rule);padding:17px 24px;background:var(--raise);
  font-size:16.5px;}
.why .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--ink3);margin-bottom:9px;}
.why .calc{margin-top:12px;padding:12px 14px;background:var(--sunk);border-radius:3px;
  border-left:2px solid var(--accent);}
.why .cite{margin-top:13px;padding-top:11px;border-top:1px solid var(--rule2);
  font-family:var(--mono);font-size:11px;color:var(--ink3);letter-spacing:.04em;}
.why .cite a{color:var(--accent);}
.flagbox{margin:0 24px 16px;padding:11px 14px;background:var(--flag-bg);
  border-left:3px solid var(--flag);font-size:15px;color:var(--ink2);border-radius:0 3px 3px 0;}
.flagbox .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--flag);font-weight:600;margin-bottom:5px;}

.showans{width:100%;padding:11px;border-top:1px solid var(--rule2);font-family:var(--mono);
  font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3);}
.showans:hover{background:var(--sunk);color:var(--ink);}

/* theory question */
.tq{background:var(--paper);border:1px solid var(--rule);box-shadow:var(--shadow);
  border-radius:3px;margin-bottom:20px;}
.tq .h{display:flex;align-items:baseline;gap:11px;padding:16px 22px 0;}
.tq .h .n{font-family:var(--sans);font-size:20px;font-weight:700;color:var(--accent);
  letter-spacing:-.03em;}
.tq .h .mk{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink3);}
.tq .qz{padding:11px 22px 16px;font-size:17.5px;}
.tq .pad{padding:0 22px 16px;}
.tq textarea{width:100%;min-height:110px;padding:11px 13px;border:1px solid var(--rule);
  border-radius:3px;background:var(--ground);color:var(--ink);font-family:var(--serif);
  font-size:16px;line-height:1.5;resize:vertical;}
.tq textarea:focus{outline:none;border-color:var(--accent);}
.tq .model{border-top:1px solid var(--rule);padding:17px 22px;background:var(--raise);}
.tq .model::before{content:"Model answer";display:block;font-family:var(--mono);
  font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink3);
  margin-bottom:11px;}

.actbar{position:sticky;bottom:0;background:var(--paper);border-top:1px solid var(--rule);
  box-shadow:var(--lift);z-index:30;}
.actbar-in{display:flex;align-items:center;gap:9px;max-width:790px;margin:0 auto;
  padding:11px 20px;}
.actbar .sp{flex:1;}

/* results */
.res{padding:44px 0 80px;}
.res .big{display:flex;align-items:baseline;gap:14px;margin-bottom:6px;}
.res .big b{font-family:var(--sans);font-size:64px;font-weight:700;letter-spacing:-.04em;
  line-height:1;color:var(--accent);font-variant-numeric:tabular-nums;}
.res .big span{font-family:var(--mono);font-size:13px;color:var(--ink3);
  letter-spacing:.06em;text-transform:uppercase;}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule);margin:28px 0;}
.grid3 div{background:var(--paper);padding:16px 18px;}
.grid3 b{display:block;font-family:var(--sans);font-size:25px;font-weight:700;
  letter-spacing:-.025em;font-variant-numeric:tabular-nums;}
.grid3 span{font-family:var(--mono);font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink3);}
.brk{border:1px solid var(--rule);background:var(--paper);margin:26px 0;}
.brk .r{display:flex;align-items:center;gap:13px;padding:11px 16px;
  border-bottom:1px solid var(--rule2);font-size:15.5px;}
.brk .r:last-child{border-bottom:none;}
.brk .r .t{flex:1;font-family:var(--sans);font-size:15px;min-width:0;}
.brk .r .bar{width:100px;height:5px;background:var(--rule2);flex:none;}
.brk .r .bar i{display:block;height:100%;background:var(--ok);}
.brk .r .v{font-family:var(--mono);font-size:12px;color:var(--ink2);flex:none;width:52px;
  text-align:right;font-variant-numeric:tabular-nums;}

/* ══ sheet / overlay ═════════════════════════════════════════════════ */
.veil{position:fixed;inset:0;background:var(--veil);z-index:50;
  opacity:0;pointer-events:none;transition:opacity .18s;}
.veil.on{opacity:1;pointer-events:auto;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--paper);
  border-top:1px solid var(--rule);max-height:82vh;display:flex;flex-direction:column;
  transform:translateY(101%);transition:transform .22s cubic-bezier(.4,0,.2,1);
  box-shadow:var(--lift);}
.sheet.on{transform:none;}
.sheet .sh{display:flex;align-items:center;gap:12px;padding:15px 22px;
  border-bottom:1px solid var(--rule);}
.sheet .sh h3{font-size:17px;letter-spacing:-.02em;}
.sheet .sb{overflow-y:auto;padding:18px 22px 26px;}
.sheet-in{max-width:860px;margin:0 auto;width:100%;}
.answersheet{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:20px;}
.answersheet button{width:34px;height:34px;border:1px solid var(--rule);border-radius:3px;
  font-family:var(--mono);font-size:11.5px;color:var(--ink3);background:var(--paper);
  font-variant-numeric:tabular-nums;transition:.12s;}
.answersheet button:hover{border-color:var(--ink3);color:var(--ink);}
.answersheet button.ok{background:var(--ok-bg);border-color:var(--ok-edge);color:var(--ok);}
.answersheet button.no{background:var(--no-bg);border-color:var(--no-edge);color:var(--no);}
.answersheet button.lk{background:var(--look-bg);border-color:var(--look);color:var(--look);}
.answersheet button.now{outline:2px solid var(--ink);outline-offset:1px;}
.answersheet button.seen{background:var(--sunk);color:var(--ink2);}

/* ══ search ══════════════════════════════════════════════════════════ */
.srch{position:fixed;inset:0;z-index:60;background:var(--veil);display:none;}
.srch.on{display:block;}
.srch .box{max-width:680px;margin:9vh auto 0;background:var(--paper);
  border:1px solid var(--rule);border-radius:5px;box-shadow:var(--shadow);
  overflow:hidden;max-height:76vh;display:flex;flex-direction:column;}
.srch input{width:100%;padding:17px 20px;border:none;background:none;font-size:18px;
  border-bottom:1px solid var(--rule);font-family:var(--sans);}
.srch input:focus{outline:none;}
.srch .out{overflow-y:auto;padding:7px;}
.srch .hit{display:block;width:100%;text-align:left;padding:10px 13px;border-radius:3px;}
.srch .hit:hover,.srch .hit.on{background:var(--sunk);}
.srch .hit .t{font-family:var(--sans);font-size:15px;font-weight:600;letter-spacing:-.012em;}
.srch .hit .c{font-size:14px;color:var(--ink3);margin-top:2px;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.srch .hit .w{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--accent);}
.srch .empty{padding:26px;text-align:center;color:var(--ink3);font-size:15px;}
mark{background:var(--accent-bg);color:var(--accent);padding:0 1px;border-radius:2px;}

/* ══ exams ═══════════════════════════════════════════════════════════ */
.dietgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule);margin:0 0 40px;}
.dietcard{background:var(--paper);padding:18px 20px;text-align:left;display:block;
  transition:background .14s;}
.dietcard:hover{background:var(--sunk);}
.dietcard .d{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink3);}
.dietcard h3{font-size:19px;margin-top:6px;letter-spacing:-.02em;}
.dietcard .m{margin-top:11px;font-family:var(--mono);font-size:10.5px;color:var(--ink3);
  display:flex;gap:11px;flex-wrap:wrap;}
.paperhead{padding:38px 0 22px;border-bottom:1px solid var(--rule);margin-bottom:26px;}
.secmark{display:flex;align-items:baseline;gap:12px;margin:44px 0 18px;
  padding-bottom:9px;border-bottom:2px solid var(--ink);}
.secmark h2{font-size:22px;letter-spacing:-.025em;}
.secmark .mk{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--ink3);
  letter-spacing:.08em;text-transform:uppercase;}
.bq{border:1px solid var(--rule);background:var(--paper);margin-bottom:18px;
  border-radius:3px;}
.bq .h{display:flex;align-items:baseline;gap:11px;padding:15px 20px;
  border-bottom:1px solid var(--rule);background:var(--sunk);}
.bq .h .n{font-family:var(--sans);font-weight:700;font-size:16px;letter-spacing:-.02em;}
.bq .h .ch{margin-left:auto;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--accent);text-decoration:none;}
a.ch:hover{text-decoration:underline;}
a.cite{color:var(--accent);text-decoration:none;cursor:pointer;}
a.cite:hover{text-decoration:underline;}
.bq .body{padding:16px 20px;}
.bq .sol{border-top:1px solid var(--rule);padding:16px 20px;background:var(--raise);}
.bq .sol.hid{display:none;}
.bq .exm{margin-top:16px;padding:12px 15px;background:var(--sunk);border-radius:3px;
  font-size:15px;color:var(--ink2);}
.bq .exm .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink3);margin-bottom:6px;}
.saqrow{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--rule2);}
.saqrow .n{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:600;
  flex:none;width:2.1em;padding-top:3px;}
.saqrow .b{flex:1;min-width:0;}
.saqrow .ans{margin-top:8px;padding:10px 13px;background:var(--ok-bg);
  border-left:2px solid var(--ok);border-radius:0 3px 3px 0;font-size:15.5px;}
.saqrow .ans.hid{display:none;}
.saqrow .ans .lbl{font-family:var(--mono);font-size:9px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ok);margin-bottom:5px;}
.revtopic{display:flex;align-items:baseline;gap:10px;padding:22px 0 8px;margin-top:8px;
  border-bottom:1px solid var(--rule);font-family:var(--sans);}
.revtopic:first-child{margin-top:0;}
.revtopic .mono{font-family:var(--mono);font-size:11px;color:var(--ink3);flex:none;}
.revtopic a,.revtopic span:not(.mono){font-size:15px;font-weight:600;letter-spacing:-.01em;
  color:var(--ink);}
.revtopic a{text-decoration:none;}
.revtopic a:hover{color:var(--accent);}
.revtopic.hid,.bq.hid,.saqrow.hid{display:none;}
.revfilter{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:16px;
  padding-top:16px;border-top:1px solid var(--rule);}
.revfilter .lbl{font-family:var(--mono);font-size:11px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink3);}
.revfilter select{font-family:var(--sans);font-size:13.5px;font-weight:500;
  padding:7px 10px;border:1px solid var(--rule);border-radius:4px;color:var(--ink);
  background:var(--paper);}
.revfilter .to{color:var(--ink3);}
.revfilter .revcount{color:var(--ink3);font-size:11px;margin-left:auto;white-space:nowrap;}
@media (max-width:600px){
  .revfilter{gap:8px;}
  .revfilter .revcount{margin-left:0;width:100%;order:5;}
}

/* ── past questions matched to a chapter (§ "Examined before") ───────── */
.pqgroup{border:1px solid var(--rule);border-radius:3px;overflow:hidden;margin-top:10px;}
.pqgroup > summary{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;
  font-size:14.5px;font-weight:600;color:var(--ink);list-style:none;user-select:none;}
.pqgroup > summary::-webkit-details-marker{display:none;}
.pqgroup > summary::before{content:'\25b8';display:inline-block;width:.8em;
  color:var(--ink4);transition:transform .15s ease;}

      '<div><b class="num" style="color:var(--look)">' + t.l + '</b><span>Looked up</span></div>' +

      if (i === Q.s.i) c += ' now';

  document.addEventListener('click', function (e) {

      '[data-look],[data-goto],[data-again],[data-phase],[data-tnav],[data-model],' +
      '[data-shuffle],[data-reset],[data-reveal]') : null;

    var d = t.dataset;
    if (d.reveal) {
      var box = document.getElementById(d.reveal);
      if (box) { box.classList.remove('hid'); t.remove(); }
      return;

    if (!Q) return;
    if (d.pick !== undefined) {
      Q.s.ans[Q.s.i] = +d.pick; delete Q.s.look[Q.s.i]; save(); draw();
    } else if (d.look) {
      Q.s.look[Q.s.i] = 1; save(); draw();

      var ni = Q.s.i + (+d.nav);
      if (ni < 0) ni = 0;
      if (ni >= Q.mcq.length) {

      }
      Q.s.i = ni; save(); draw(); window.scrollTo(0, 0);

      var ti = (Q.s.ti || 0) + (+d.tnav);
      if (ti < 0) { Q.s.phase = 'mcq'; Q.s.ti = 0; save(); return draw(); }
      if (ti >= Q.theory.length) { Q.s.phase = 'results'; save(); return draw(); }
      Q.s.ti = ti; save(); draw(); window.scrollTo(0, 0);
    } else if (d.model !== undefined) {
      Q.s.look['t' + d.model] = 1; save(); draw();
    } else if (d.jump) {
      jump();
    } else if (d.goto !== undefined) {
      Q.s.i = +d.goto; Q.s.phase = 'mcq'; save(); A.closeSheet(); draw(); window.scrollTo(0, 0);
    } else if (d.phase) {
      Q.s.phase = d.phase; save(); A.closeSheet(); draw(); window.scrollTo(0, 0);
    } else if (d.again) {
      Q.s = { n: Q.s.n, i: 0, ans: {}, look: {}, phase: 'mcq', ti: 0 }; save(); draw();
    } else if (d.shuffle) {
      for (var i = Q.mcq.length - 1; i > 0; i--) {
        var j = Math.floor(Math.random() * (i + 1));
        var tmp = Q.mcq[i]; Q.mcq[i] = Q.mcq[j]; Q.mcq[j] = tmp;
      }
      Q.s = { n: Q.s.n, i: 0, ans: {}, look: {}, phase: 'mcq', ti: 0 };
      save(); A.closeSheet(); draw();
    } else if (d.reset) {
      Q.s = { n: Q.s.n, i: 0, ans: {}, look: {}, phase: 'mcq', ti: 0 };
      save(); A.closeSheet(); draw();
    }
  });

  document.addEventListener('keydown', function (e) {
    if (!Q || /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    var k = e.key.toUpperCase();
    if (Q.s.phase === 'mcq') {
      var idx = 'ABCDE'.indexOf(k);
      if (idx >= 0 && idx < (Q.mcq[Q.s.i] || { o: [] }).o.length) {
        e.preventDefault();
        if (Q.s.ans[Q.s.i] === undefined && !Q.s.look[Q.s.i]) {
          Q.s.ans[Q.s.i] = idx; save(); draw();
        }
        return;
      }
      if (k === 'S') { Q.s.look[Q.s.i] = 1; save(); draw(); e.preventDefault(); return; }
    }
    if (e.key === 'ArrowRight' || e.key === 'Enter') {
      var b = document.querySelector('[data-nav="1"],[data-tnav="1"]');
      if (b) { b.click(); e.preventDefault(); }
    }
    if (e.key === 'ArrowLeft') {
      var p = document.querySelector('[data-nav="-1"],[data-tnav="-1"]');
      if (p) { p.click(); e.preventDefault(); }
    }
    if (k === 'J' && Q.s.phase === 'mcq') { jump(); e.preventDefault(); }
  });

  ATSWA.quizClear = function () { Q = null; };

/* -- Final Revision: every past question, grouped by course, then by

(function () {
  var A = ATSWA, V = A.VIEWS;

  function withRevision(cb) {
    A.loading('Final Revision');
    A.need('REVISION', 'revision', function (rev) {
      if (!rev) return A.h('<div class="wrap"><p style="padding:60px 0">Could not load the ' +
        'revision bank. Serve this folder over http:// rather than opening the file directly.</p></div>');
      cb(rev);
    });
  }

  function chBadge(subj, ch, sec) {
    if (!ch) return '';
    if (sec) return '<a class="ch" href="#/s/' + subj + '/' + ch + '?sec=' +
      String(sec).replace(/\./g, '-') + '">Chapter ' + ch + ' &rarr;</a>';
    return '<a class="ch" href="#/s/' + subj + '/' + ch + '">Chapter ' + ch + '</a>';
  }

  function freqBadge(freq) {
    return '<span class="mono" style="font-size:10px;letter-spacing:.08em;color:var(--ink3);' +
      'white-space:nowrap">ASKED ' + freq + '&times;</span>';
  }

  /* Every diet a cluster was asked in ('2019-03', '2020-09', ...) reduced to
     its distinct years, for the year-range sorter below. */
  function yearsOf(diets) {
    var seen = {}, out = [];
    (diets || []).forEach(function (d) {
      var y = d.slice(0, 4);
      if (!seen[y]) { seen[y] = 1; out.push(y); }
    });
    return out;
  }

  /* ---- year-range sorter, mcq/saq/essay lists ------------------------ */
  function yearFilterBar(list) {
    var all = {};
    list.forEach(function (q) { yearsOf(q.diets).forEach(function (y) { all[y] = 1; }); });
    var years = Object.keys(all).sort();
    if (years.length < 2) return '';
    var opts = years.map(function (y) { return '<option value="' + y + '">' + y + '</option>'; }).join('');
    return '<div class="revfilter">' +
      '<span class="lbl">Diet years</span>' +
      '<select id="revYearFrom" aria-label="From year">' + opts + '</select>' +
      '<span class="to">&ndash;</span>' +
      '<select id="revYearTo" aria-label="To year">' + opts + '</select>' +
      '<span class="mono revcount" id="revCount"></span>' +
      '<button class="btn sm" id="revYearReset" type="button">Reset</button>' +
      '</div>';
  }

  function wireYearFilter() {
    var from = A.el('revYearFrom'), to = A.el('revYearTo'), reset = A.el('revYearReset');
    if (!from || !to) return;
    to.value = to.options[to.options.length - 1].value; // default: full range
    var items = [].slice.call(document.querySelectorAll('[data-years]'));
    var topics = [].slice.call(document.querySelectorAll('.revtopic'));
    function apply() {
      var lo = from.value, hi = to.value;
      if (lo > hi) { var t = lo; lo = hi; hi = t; }
      var shown = 0;
      items.forEach(function (el) {
        var ys = el.getAttribute('data-years').split(' ');
        var inRange = ys.some(function (y) { return y >= lo && y <= hi; });
        el.classList.toggle('hid', !inRange);
        if (inRange) shown++;
      });
      // A topic header (short-answer grouping) hides itself when every
      // question in that topic has been filtered out.
      topics.forEach(function (h) {
        var sib = h.nextElementSibling, anyShown = false;
        while (sib && !sib.classList.contains('revtopic')) {
          if (sib.hasAttribute('data-years') && !sib.classList.contains('hid')) anyShown = true;
          sib = sib.nextElementSibling;
        }
        h.classList.toggle('hid', !anyShown);
      });
      var cnt = A.el('revCount');
      if (cnt) cnt.textContent = shown + ' of ' + items.length + ' shown';
    }
    from.addEventListener('change', apply);
    to.addEventListener('change', apply);
    if (reset) reset.addEventListener('click', function () {
      from.value = from.options[0].value;

      apply();

  /* ---- subject picker ------------------------------------------------ */

        return '<a class="subcard" href="#/revision/' + s.code + '" data-sub="' + s.code + '">' +
          '<div class="r1"><span class="code">' + s.code + '</span>' +

          ' questions, most-asked first.') +
        ' "Asked N&times;" counts how many diets carried a near-identical version of ' +
        'that question.</p>' +
        '<div class="sbar"><a class="btn" href="#/revision/' + code + '">' + A.esc(s.name) + '</a>' +
        '<a class="btn" href="#/revision">All subjects</a>' +
        (kind === 'essay' ? '<button class="btn" data-revealall="1">Reveal every solution</button>' : '') +
        '</div>' + yearFilterBar(list) +
        '</section>' + body + '<div style="height:60px"></div></div>');
      wireYearFilter();
    });
  };
})();
/* -- past papers, search, formulas, progress, boot --------------------- */
(function () {
  var A = ATSWA, V = A.VIEWS;

  function withExams(cb) {
    A.loading('Past papers');
    A.need('EXAMS', 'exams', function (ex) {
      if (!ex) return A.h('<div class="wrap"><p style="padding:60px 0">Could not load the past ' +
        'papers. Serve this folder over http:// rather than opening the file directly.</p></div>');
      cb(ex);
    });
  }
  function findPaper(ex, diet, code) {
    for (var i = 0; i < ex.papers.length; i++)
      if (ex.papers[i].diet === diet && ex.papers[i].subject === code) return ex.papers[i];
    return null;
  }
  /* the "Chapter N" tag on a past question: a plain badge where there is no
     confident section match, a link straight to the passage it was worked
     from where there is */
  function chBadge(subj, q) {
    if (!q.ch) return '';
    if (q.sec) return '<a class="ch" href="#/s/' + subj + '/' + q.ch + '?sec=' +
      String(q.sec).replace(/\./g, '-') + '">Chapter ' + q.ch + ' &rarr;</a>';
    return '<a class="ch" href="#/s/' + subj + '/' + q.ch + '">Chapter ' + q.ch + '</a>';
  }

  /* ---- index -------------------------------------------------------- */
  V.exams = function () {
    withExams(function (ex) {
      var only = route_q('s');
      var diets = {};
      ex.papers.forEach(function (p) { (diets[p.diet] = diets[p.diet] || []).push(p); });
      var order = Object.keys(diets).sort().reverse();
      var body = order.map(function (d) {
        var ps = diets[d].filter(function (p) { return !only || p.subject === only; });
        if (!ps.length) return '';
        return '<h3 style="font-size:20px;margin:34px 0 12px;letter-spacing:-.02em">' +
          A.esc(ps[0].name) + '</h3><div class="dietgrid">' +
          ps.map(function (p) {
            var s = A.subOf(p.subject);
            return '<a class="dietcard" href="#/exams/' + p.diet + '/' + p.subject + '" ' +
              'data-sub="' + p.subject + '">' +
              '<div class="d">' + p.subject + '</div><h3>' + A.esc(s ? s.name : p.subject) + '</h3>' +
              '<div class="m"><span>' + p.mcq.length + ' MCQ</span><span>' + p.saq.length +
              ' short</span><span>' + p.secb.length + ' essay</span></div></a>';
          }).join('') + '</div>';
      }).join('');
      var oldest = diets[order[order.length - 1]][0].name;
      var newest = diets[order[0]][0].name;
      A.h('<div class="wrap"><section class="shead" style="border:none">' +
        '<div class="code">Past papers</div><h1>' + order.length + ' diets, ' +
        ex.papers.length + ' papers</h1>' +
        '<p>Every ATSWA Part II paper from ' + A.esc(oldest) + ' to ' + A.esc(newest) +
        ', exactly as sat, with the examiners&rsquo; own solutions and reports. Read one ' +
        'through, or sit it against the clock.</p>' +
        (only ? '<div class="sbar"><a class="btn" href="#/exams">Show all subjects</a></div>' : '') +
        '</section>' + body + '<div style="height:60px"></div></div>');
    });
  };
  function route_q(k) {
    var raw = location.hash, i = raw.indexOf('?');
    if (i < 0) return '';
    var out = '';
    raw.slice(i + 1).split('&').forEach(function (kv) {
      var p = kv.split('='); if (decodeURIComponent(p[0]) === k) out = decodeURIComponent(p[1] || '');
    });
    return out;
  }

  /* ---- one paper, read through ------------------------------------- */
  V.paper = function (diet, code) {
    withExams(function (ex) {
      var p = findPaper(ex, diet, code);
      if (!p) return V.exams();
      var s = A.subOf(code);

      var mcq = p.mcq.map(function (q) {
        var ans = p.key[q.n];
        var flag = ex.flags[diet + '/' + code + '/mcq/' + q.n];
        return '<div class="bq"><div class="h"><span class="n">' + q.n + '</span>' +
          chBadge(code, q) + '</div>' +
          '<div class="body">' + A.preBlock(q.pre) + A.stemHTML(q) +
          '<div style="margin-top:10px">' + q.options.map(function (o, k) {
            var on = ans === 'ABCDE'[k];
            return '<div style="display:flex;gap:10px;padding:4px 0' +
              (on ? ';color:var(--ok);font-weight:600' : '') + '">' +
              '<span class="mono" style="width:1.4em;flex:none">' + 'ABCDE'[k] + '</span>' +
              '<span style="flex:1">' + A.optText(o) + '</span>' +
              (on ? '<span class="mono" style="font-size:10px;letter-spacing:.1em">ANSWER</span>' : '') +
              '</div>';
          }).join('') + '</div>' +
          (flag ? '<div class="flagbox" style="margin:12px 0 0"><div class="lbl">Check this</div>' +
                  A.esc(flag) + '</div>' : '') +
          '</div></div>';
      }).join('');

      var saq = p.saq.map(function (q) {
        var badge = chBadge(code, q);
        return '<div class="saqrow"><span class="n">' + q.n + '</span><div class="b">' +
          A.preBlock(q.pre) +
          '<div>' + R.inl(q.body.join(' ')) + '</div>' +
          (q.ans ? '<div class="ans"><div class="lbl">Official answer</div>' +
                   R.inl(q.ans.join(' ')) + '</div>' : '') +
          (badge ? '<div style="margin-top:8px">' + badge + '</div>' : '') +
          '</div></div>';
      }).join('');

      var secb = p.secb.map(function (b) {
        return '<div class="bq"><div class="h"><span class="n">Question ' + b.n + '</span>' +
          chBadge(code, b) + '</div>' +
          (b.q && b.q.length ? '<div class="body"><div class="pre">' +
            A.esc(b.q.join('\n')) + '</div></div>' : '') +
          '<button class="reveal" data-reveal="sol' + p.diet + code + b.n + '">' +
          'Show the official solution</button>' +
          '<div class="sol hid" id="sol' + p.diet + code + b.n + '">' +
          (b.note ? R.blocks(b.note) : '') +
          '<div class="pre">' + A.esc(b.solution.join('\n')) + '</div>' +
          (b.examiner && b.examiner.length
            ? '<div class="exm"><div class="lbl">Examiner&rsquo;s report</div>' +
              A.esc(b.examiner.join(' ')) + '</div>' : '') +
          '</div></div>';
      }).join('');

      A.h('<div class="wrap"><section class="paperhead">' +
        '<div class="code">' + A.esc(p.name) + ' &middot; ' + code + '</div>' +
        '<h1 style="font-size:clamp(28px,4.4vw,42px);letter-spacing:-.032em;margin-top:8px">' +
        A.esc(s ? s.name : code) + '</h1>' +
        '<div class="sbar"><a class="btn pri" href="#/exams/' + diet + '/' + code + '/sit">' +
        'Sit this paper &middot; 3 hours</a>' +
        '<a class="btn" href="#/exams">All papers</a>' +
        '<button class="btn" data-revealall="1">Reveal every solution</button></div>' +
        '</section>' +
        '<div class="secmark"><h2>Section A, Part I</h2><span class="mk">Multiple choice ' +
        '&middot; 30 marks</span></div>' + mcq +
        '<div class="secmark"><h2>Section A, Part II</h2><span class="mk">Short answer ' +
        '&middot; 20 marks</span></div><div style="margin-bottom:30px">' + saq + '</div>' +
        '<div class="secmark"><h2>Section B</h2><span class="mk">Answer any four ' +
        '&middot; 50 marks</span></div>' + secb +
        '<div style="height:60px"></div></div>');
    });
  };

  /* ---- sit the paper ------------------------------------------------- */
  V.sit = function (diet, code) {
    withExams(function (ex) {
      var p = findPaper(ex, diet, code);
      if (!p) return V.exams();
      var s = A.subOf(code);
      var mcq = p.mcq.map(function (q) {
        var ans = p.key[q.n];
        return {
          q: q.stem, o: q.options, a: 'ABCDE'.indexOf(ans), pre: q.pre || [], past: true,
          src: p.name + ' &middot; Q' + q.n, ch: q.ch, sec: q.sec,
          w: ex.notes[diet + '/' + code + '/mcq/' + q.n] || '',
          flag: ex.flags[diet + '/' + code + '/mcq/' + q.n] || ''
        };
      }).filter(function (q) { return q.a >= 0; });
      var theory = p.saq.filter(function (q) { return q.ans; }).map(function (q) {
        return { q: q.body.join(' '), marks: 1, short: true, pre: q.pre || [],
                 a: [{ p: '**' + q.ans.join(' ') + '**' }],
                 src: p.name + ' &middot; Short answer ' + q.n, ch: q.ch, sec: q.sec };
      }).concat(p.secb.map(function (b) {
        return { q: 'Question ' + b.n + ' — see the paper for the full text.',
                 marks: 12.5, pre: b.q || [],
                 a: [{ pre: b.solution.join('\n') }].concat(
                    b.examiner && b.examiner.length
                      ? [{ note: b.examiner.join(' '), lbl: "Examiner's report" }] : []),
                 src: p.name + ' &middot; Section B, Q' + b.n, ch: b.ch, sec: b.sec };
      }));
      var kkey = A.PK + 'sit:' + diet + '/' + code + ':start';
      var started = A.get(kkey, 0);
      if (!started) { started = Date.now(); A.set(kkey, started); }
      A.quizStart({
        key: 'sit:' + diet + '/' + code,
        title: A.esc(p.name) + ' &middot; ' + (s ? s.name : code),
        back: '#/exams/' + diet + '/' + code,
        code: code,
        mcq: mcq, theory: theory,
        exam: true, deadline: started + 3 * 60 * 60 * 1000
      });
    });
  };

  /* ---- formula index ------------------------------------------------- */
  V.formulas = function () {
    var want = SUBJECTS.filter(function (s) { return s.formulas !== false; });
    A.loading('Formulas');
    var got = 0, all = {};
    want.forEach(function (s) {
      A.need(s.code, s.file, function (d) {
        all[s.code] = d; got++;
        if (got === want.length) show();
      });
    });
    function show() {
      var body = want.map(function (s) {
        var d = all[s.code];
        if (!d) return '';
        var chunks = d.chapters.filter(function (c) { return c.formulas && c.formulas.length; })
          .map(function (c) {
            return '<h3 style="font-size:18px;margin:26px 0 10px;letter-spacing:-.02em">' +
              '<a href="#/s/' + s.code + '/' + c.n + '">' + c.n + '. ' + A.esc(c.t) + '</a></h3>' +
              R.block({ fbox: { h: '', rows: c.formulas } });
          }).join('');
        if (!chunks) return '';
        return '<section data-sub="' + s.code + '" style="margin-bottom:44px">' +
          '<div class="secmark"><h2>' + A.esc(s.name) + '</h2>' +
          '<span class="mk">' + s.code + '</span></div>' + chunks + '</section>';
      }).join('');
      A.h('<div class="wrap"><section class="shead" style="border:none">' +
        '<div class="code">Reference</div><h1>Every formula, in one place</h1>' +
        '<p>Pulled from the chapters, in chapter order. Each heading links back to where the ' +
        'formula is derived and used.</p></section>' + (body ||
        '<p style="padding:40px 0;color:var(--ink3)">No formulas recorded yet.</p>') +
        '<div style="height:60px"></div></div>');
    }
  };

  /* ---- progress ------------------------------------------------------ */
  V.progress = function () {
    var p = A.prog();
    var cards = SUBJECTS.map(function (s) {
      var st = A.subStats(s.code);
      var heat = [];
      for (var i = 1; i <= s.n; i++) {
        var r = p[s.code + '/' + i] || {};
        var v = 0;
        if (r.read) v = 1;
        if (r.quiz) v = r.best >= 0.8 ? 4 : r.best >= 0.6 ? 3 : 2;
        heat.push('<i data-v="' + v + '" title="Chapter ' + i + '"></i>');
      }
      return '<div class="pcard" data-sub="' + s.code + '">' +
        '<div class="s">' + s.code + '</div><h3>' + A.esc(s.name) + '</h3>' +
        '<div class="heat">' + heat.join('') + '</div>' +
        '<div style="margin-top:14px;display:flex;gap:18px;font-family:var(--mono);' +
        'font-size:11px;color:var(--ink3)">' +
        '<span><b style="color:var(--ink)">' + st.read + '</b>/' + st.n + ' read</span>' +
        '<span><b style="color:var(--ink)">' + st.done + '</b> quizzed</span>' +
        (st.done ? '<span><b style="color:var(--ink)">' + st.avg + '%</b> avg</span>' : '') +
        '</div>' +
        '<div style="margin-top:14px"><a class="btn sm" href="#/s/' + s.code + '">Open</a></div>' +
        '</div>';
    }).join('');
    A.h('<div class="wrap"><section class="shead" style="border:none">' +
      '<div class="code">Progress</div><h1>Where you are</h1>' +
      '<p>Kept in this browser only. Reading a chapter marks it; taking its quiz records your ' +
      'best score.</p></section>' +
      '<div class="pgrid">' + cards + '</div>' +
      '<div style="margin-bottom:70px"><button class="btn" id="wipe">Clear all progress</button></div>' +
      '</div>');
    var w = A.el('wipe');
    if (w) w.addEventListener('click', function () {
      if (w.dataset.armed) {
        try {
          var ks = [];
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (k.indexOf(A.PK) === 0) ks.push(k);
          }
          ks.forEach(function (k) { localStorage.removeItem(k); });
        } catch (e) {}
        location.reload();
      } else { w.dataset.armed = '1'; w.textContent = 'Click again to erase everything'; }
    });
  };

  /* ---- search --------------------------------------------------------- */
  var IDX = null, building = false;
  function buildIndex(done) {
    if (IDX) return done(IDX);
    if (building) return;
    building = true;
    var got = 0;
    IDX = [];
    SUBJECTS.forEach(function (s) {
      A.need(s.code, s.file, function (d) {
        if (d) d.chapters.forEach(function (c) {
          IDX.push({ t: c.n + '. ' + c.t, c: c.brief || '', w: s.code + ' chapter',
                     u: '#/s/' + s.code + '/' + c.n,
                     x: (c.t + ' ' + (c.brief || '') + ' ' +
                         (c.outcomes || []).join(' ')).toLowerCase() });
          (c.secs || []).forEach(function (sec) {
            IDX.push({ t: sec.t, c: R.text(sec.b).slice(0, 220),
                       w: s.code + ' ' + sec.n,
                       u: '#/s/' + s.code + '/' + c.n + '#sec-' + String(sec.n).replace(/\./g, '-'),
                       x: (sec.t + ' ' + R.text(sec.b)).toLowerCase() });
          });
        });
        if (++got === SUBJECTS.length) { building = false; done(IDX); }
      });
    });
  }
  function runSearch(qs) {
    var out = A.el('srch-o');
    var q = qs.trim().toLowerCase();
    if (q.length < 2) { out.innerHTML = '<div class="empty">Type at least two letters.</div>'; return; }
    buildIndex(function (idx) {
      var terms = q.split(/\s+/);
      var hits = [];
      idx.forEach(function (r) {
        var sc = 0;
        terms.forEach(function (t) {
          var i = r.x.indexOf(t);
          if (i < 0) { sc = -1e9; return; }
          sc += 12 - Math.min(10, i / 60);
          if (r.t.toLowerCase().indexOf(t) >= 0) sc += 24;
        });
        if (sc > 0) hits.push({ r: r, s: sc });
      });
      hits.sort(function (a, b) { return b.s - a.s; });
      if (!hits.length) { out.innerHTML = '<div class="empty">Nothing found.</div>'; return; }
      out.innerHTML = hits.slice(0, 40).map(function (x, i) {
        return '<a class="hit' + (i === 0 ? ' on' : '') + '" href="' + x.r.u + '">' +
          '<span class="w">' + A.esc(x.r.w) + '</span>' +
          '<div class="t">' + hl(x.r.t, terms) + '</div>' +
          '<div class="c">' + hl(x.r.c, terms) + '</div></a>';
      }).join('');
    });
  }
  function hl(s, terms) {
    s = A.esc(s);
    terms.forEach(function (t) {
      if (!t) return;
      s = s.replace(new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'),
                    '<mark>$1</mark>');
    });
    return s;
  }
  function openSearch() {
    A.el('srch').classList.add('on');
    var i = A.el('srch-i'); i.value = ''; i.focus();
    A.el('srch-o').innerHTML = '<div class="empty">Search every chapter and section.</div>';
    buildIndex(function () {});
  }

  /* ---- boot ----------------------------------------------------------- */
  function theme() {
    var t = A.get(A.PK + 'theme', null);
    if (t) document.documentElement.setAttribute('data-theme', t);
  }
  function toggleTheme() {
    var cur = document.documentElement.getAttribute('data-theme');
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches;
    var next = cur ? (cur === 'dark' ? 'light' : 'dark') : (dark ? 'light' : 'dark');
    document.documentElement.setAttribute('data-theme', next);
    A.set(A.PK + 'theme', next);
  }

  function foot() {
    A.el('foot').innerHTML = '<p>Written from the 2025 ATSWA Part&nbsp;II study texts (fifth ' +
      'edition) and the INSIGHT past-question packs, March 2014 to March 2026. The chapter notes ' +
      'are a study aid, not a substitute for the study text; check anything that matters against ' +
      'it and against your tutor. <a href="#/about">About</a></p>' +
      '<p style="margin-top:10px;font-size:13px;color:var(--ink4)">Keys: <b>A</b>&ndash;<b>E</b> ' +
      'answer &middot; <b>S</b> show answer &middot; <b>J</b> jump &middot; <b>/</b> search ' +
      '&middot; <b>Esc</b> close</p>';
  }

  function boot() {
    theme(); foot();
    A.el('btn-theme').addEventListener('click', toggleTheme);
    A.el('btn-search').addEventListener('click', openSearch);
    A.el('sheet-x').addEventListener('click', A.closeSheet);
    A.el('veil').addEventListener('click', A.closeSheet);
    A.el('srch').addEventListener('click', function (e) {
      if (e.target.id === 'srch') A.el('srch').classList.remove('on');
    });
    A.el('srch-i').addEventListener('input', function (e) { runSearch(e.target.value); });
    A.el('srch-i').addEventListener('keydown', function (e) {
      var hits = [].slice.call(document.querySelectorAll('.srch .hit'));
      var cur = hits.findIndex(function (x) { return x.classList.contains('on'); });
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        if (!hits.length) return;
        var ni = Math.max(0, Math.min(hits.length - 1, cur + (e.key === 'ArrowDown' ? 1 : -1)));
        hits.forEach(function (x) { x.classList.remove('on'); });
        hits[ni].classList.add('on'); hits[ni].scrollIntoView({ block: 'nearest' });
      }
      if (e.key === 'Enter' && hits[cur < 0 ? 0 : cur]) {
        e.preventDefault();
        location.hash = hits[cur < 0 ? 0 : cur].getAttribute('href');
        A.el('srch').classList.remove('on');
      }
    });
    document.addEventListener('keydown', function (e) {
      if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) {
        if (e.key === 'Escape') { A.el('srch').classList.remove('on'); e.target.blur(); }
        return;
      }
      if (e.key === '/' && !e.metaKey && !e.ctrlKey) { e.preventDefault(); openSearch(); }
      if (e.key === 'Escape') { A.el('srch').classList.remove('on'); A.closeSheet(); }
    });
    document.addEventListener('click', function (e) {
      var t = e.target.closest && e.target.closest('[data-revealall]');
      if (!t) return;
      [].slice.call(document.querySelectorAll('.sol.hid, .az.hid')).forEach(function (x) {
        x.classList.remove('hid');
      });
      [].slice.call(document.querySelectorAll('.reveal')).forEach(function (x) { x.remove(); });
      t.remove();
    });
    window.addEventListener('hashchange', function () {
      /* A bare "#sec-2-6" hash is an in-page jump — the "In this chapter"
         sidebar links on the chapter reader use exactly this — not a route.
         Re-rendering on it would tear down the very page it is meant to
         scroll within (parseHash sees no "/s/..." prefix and falls back to
         the home view), so it gets a plain native-style scroll and nothing
         else. Every real route change still re-renders as before. */
      if (/^#sec-[\w-]+$/.test(location.hash)) {
        var el = document.getElementById(location.hash.slice(1));
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        return;
      }
      ATSWA.quizClear();
      A.render(); A.tabs();
      var m = location.hash.match(/#sec-[\w-]+$/);
      if (m) {
        setTimeout(function () {
          var t = document.getElementById(m[0].slice(1));
          if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 60);
      }
    });
    A.render(); A.tabs();
  }

  if (document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
